<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KizuNaka</title>
  <meta name="description" content="Adivina el anime del día, busca un anime por captura y descubre qué manga leer.">
  <meta name="author" content="peter1323">
  <meta name="copyright" content="© 2026 peter1323. Todos los derechos reservados.">
  <meta name="theme-color" content="#14111f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <!-- Cabecera con el logo y el botón de tema -->
  <header class="cabecera">
    <h1 class="logo"><span class="logo-kanji">絆</span>KizuNaka</h1>
    <button id="boton-tema" class="boton-icono" aria-label="Cambiar tema">🌙</button>
  </header>

  <!-- Cada sección la rellena su controlador -->
  <main>
    <section id="juego" hidden></section>
    <section id="captura" hidden></section>
    <section id="recomendador" hidden></section>
  </main>

  <!-- Barra de navegación inferior -->
  <nav class="navegacion">
    <a href="#juego" data-ruta="juego"><span class="nav-icono">🎮</span><span>Adivina</span></a>
    <a href="#captura" data-ruta="captura"><span class="nav-icono">📸</span><span>Captura</span></a>
    <a href="#recomendador" data-ruta="recomendador"><span class="nav-icono">📚</span><span>¿Qué leo/veo?</span></a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
